<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>上下求索 · 青塘遗址</title>
<style>
  /* ========== 地基：尺寸体系 / 全局变量（美化时改这里，不碰结构） ========== */
  :root{
    --color-tubrown:#8B6F47;   /* 土棕 */
    --color-rock:#6E6256;      /* 岩灰 */
    --color-paper:#EFE4CC;     /* 米白 */
    --color-zhusha:#B23A2E;    /* 朱砂红 */
    --color-ink:#3A2E22;       /* 墨褐 */
    --cta-grad: linear-gradient(180deg,#9c7a4e,#6b4e2e);
    --ratio: 9 / 16;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;background:#1a1510;overflow:hidden;
    font-family:"STKaiti","KaiTi","Songti SC","Microsoft YaHei",serif;}
  #app{width:100vw;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;}
  /* 竖屏舞台：等比 9:16，显式宽高兼容所有手机浏览器与微信 WebView */
  #stage{position:relative;
    width:100vw;height:177.78vw;
    max-width:56.25vh;max-width:56.25dvh;
    max-height:100vh;max-height:100dvh;
    background:#1a1510;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.6);}

  /* ========== 页面容器：状态驱动显隐 ========== */
  .page{position:absolute;inset:0;background-size:cover;background-position:center;
    opacity:0;visibility:hidden;transition:opacity .45s ease;z-index:1;}
  .page.active{opacity:1;visibility:visible;z-index:2;}
  .page video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

  /* ========== 顶部 6 格进度条（全局常驻） ========== */
  #progress{position:absolute;top:2.2%;left:50%;transform:translateX(-50%);
    display:flex;gap:2.2%;width:70%;z-index:30;pointer-events:none;opacity:0;transition:opacity .4s;}
  #progress.show{opacity:1;}
  #progress .cell{flex:1;height:7px;border-radius:4px;background:rgba(58,46,34,.35);
    border:1px solid rgba(239,228,204,.55);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:all .5s;}
  #progress .cell.lit{background:linear-gradient(180deg,#d8a84e,#B23A2E);
    border-color:#f0d9a0;box-shadow:0 0 8px rgba(216,168,78,.9);}

  /* ========== 热区（透明可点，带轻微呼吸提示） ========== */
  .hotspot{position:absolute;z-index:20;cursor:pointer;border-radius:16px;}
  .hotspot.hint::after{content:"";position:absolute;inset:0;border-radius:16px;
    border:2px solid rgba(216,168,78,.75);box-shadow:0 0 16px rgba(216,168,78,.5);
    opacity:0;animation:breathe 1.8s ease-in-out infinite;will-change:opacity;}
  @keyframes breathe{0%,100%{opacity:0;}50%{opacity:1;}}

  /* ========== 国风 CTA 按钮（图上没画按钮的页面用） ========== */
  .cta{position:absolute;left:50%;transform:translateX(-50%);z-index:25;
    padding:2.6% 9%;border-radius:40px;background:var(--cta-grad);
    color:#f3e7c9;font-size:clamp(16px,4.6vmin,26px);letter-spacing:.15em;font-weight:700;
    border:1.5px solid #d8b878;box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 1px 2px rgba(255,255,255,.3);
    cursor:pointer;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:opacity .4s,transform .15s;}
  .cta.show{opacity:1;pointer-events:auto;animation:ctaIn .5s ease;}
  .cta:active{transform:translateX(-50%) scale(.95);}
  @keyframes ctaIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translateX(-50%);}}

  /* ========== 刮除画布 ========== */
  .scratch{position:absolute;inset:0;z-index:10;touch-action:none;transition:opacity .6s;}

  /* ========== 拼图交互 ========== */
  #s-puzzle{background:#1a1510;touch-action:none;}
  .puzzle-board{position:absolute;left:50%;top:50%;width:111.2%;height:100%;
    transform:translate(-50%,-50%);background:center/100% 100% no-repeat;overflow:hidden;}
  .puzzle-piece{position:absolute;z-index:8;cursor:grab;touch-action:none;
    transition:left .34s cubic-bezier(.2,.75,.25,1),top .34s cubic-bezier(.2,.75,.25,1),
      width .34s cubic-bezier(.2,.75,.25,1),height .34s cubic-bezier(.2,.75,.25,1),transform .34s cubic-bezier(.2,.75,.25,1);
    filter:drop-shadow(0 5px 5px rgba(54,35,20,.3));will-change:transform,left,top;}
  .puzzle-piece img{display:block;width:100%;height:100%;pointer-events:none;user-select:none;}
  .puzzle-piece.dragging{transition:none;cursor:grabbing;z-index:18;
    filter:drop-shadow(0 12px 9px rgba(54,35,20,.38)) brightness(1.04);}
  .puzzle-piece.locked{pointer-events:none;z-index:6;filter:drop-shadow(0 2px 2px rgba(54,35,20,.2));}
  .puzzle-progress{position:absolute;left:50%;top:13.2%;transform:translateX(-50%);z-index:20;
    padding:.8% 4%;border-radius:24px;background:rgba(58,46,34,.78);border:1px solid rgba(216,184,120,.8);
    color:#f3e7c9;font-size:clamp(12px,3.3vmin,18px);letter-spacing:.09em;white-space:nowrap;
    box-shadow:0 3px 12px rgba(0,0,0,.28);touch-action:none;}
  .puzzle-progress.done{background:rgba(139,111,71,.92);border-color:#f0d9a0;}

  /* ========== 成功 / 提示浮层 ========== */
  .toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:40;
    padding:2.5% 6%;background:rgba(58,46,34,.9);color:#f3e7c9;border:1.5px solid #d8b878;
    border-radius:14px;font-size:clamp(14px,4vmin,22px);letter-spacing:.08em;white-space:nowrap;
    box-shadow:0 6px 20px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .4s,top .4s;}
  .toast.show{opacity:1;top:11%;}

  .hintword{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);z-index:15;
    color:#fff;font-size:clamp(13px,3.6vmin,20px);letter-spacing:.1em;text-shadow:0 2px 6px rgba(0,0,0,.8);
    background:rgba(0,0,0,.25);padding:1.4% 4%;border-radius:30px;pointer-events:none;
    animation:floatUp 2s ease-in-out infinite;}
  @keyframes floatUp{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,-8px);}}

  /* 翻页过渡（宣纸） */
  #flip{position:absolute;inset:0;z-index:50;background:#efe4cc;opacity:0;pointer-events:none;
    transition:opacity .25s;}
  #flip.on{opacity:1;}

  .fadebtn{opacity:0;animation:none;}

  /* 跳过按钮 */
  .skip{position:absolute;right:4%;top:3.2%;z-index:25;padding:1.2% 4.2%;border-radius:30px;
    background:rgba(58,46,34,.55);color:#f3e7c9;font-size:clamp(12px,3.2vmin,18px);
    letter-spacing:.12em;border:1px solid rgba(216,184,120,.6);cursor:pointer;}
  .skip:active{transform:scale(.95);}

  /* 声音开关 */
  #soundBtn{position:absolute;left:4%;top:2.6%;z-index:36;width:clamp(30px,8vmin,42px);height:clamp(30px,8vmin,42px);
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    background:rgba(58,46,34,.55);border:1px solid rgba(216,184,120,.6);color:#f3e7c9;
    font-size:clamp(15px,4vmin,22px);cursor:pointer;user-select:none;}
  #soundBtn:active{transform:scale(.92);}

  /* 第三组答题错误页的左上角返回按钮 */
  #btn-wrong.back-corner{left:19%;transform:none;padding:1.5% 4.8%;border-radius:28px;
    font-size:clamp(13px,3.8vmin,20px);letter-spacing:.12em;}
  #btn-wrong.back-corner.show{animation:none;transform:none;}
  #btn-wrong.back-corner:active{transform:scale(.95);}

  /* 第三组知识卡底部按钮：缩小并下移，避免遮挡介绍文字 */
  .cta.compact{padding:1.7% 6.5%;font-size:clamp(13px,3.8vmin,21px);letter-spacing:.1em;}

  /* 第六组拼图：遮住原图中预留的碎片，仅保留目标网格和拖动提示 */
  .r6-piece-backdrop{position:absolute;left:4.5%;top:62.5%;width:91%;height:36.5%;z-index:4;
    background:rgba(244,233,210,.94);border-radius:12px;box-shadow:inset 0 0 28px rgba(114,82,44,.12);
    backdrop-filter:blur(2px);display:none;pointer-events:none;}
  .r6-piece-backdrop.show{display:block;}

  /* 结尾叙事页 */
  .ending-hit{position:absolute;inset:0;z-index:20;cursor:pointer;}
  .ending-prompt{position:absolute;left:50%;bottom:5.2%;transform:translateX(-50%);z-index:22;
    color:rgba(58,36,20,.72);font-size:clamp(12px,3.2vmin,18px);letter-spacing:.18em;
    white-space:nowrap;animation:endingPrompt 2s ease-in-out infinite;pointer-events:none;}
  @keyframes endingPrompt{0%,100%{opacity:.45;}50%{opacity:.95;}}
  .ending-copy{position:absolute;left:5.7%;top:19%;width:88.6%;height:69%;z-index:22;
    color:#2c160c;text-align:center;font-weight:700;font-size:clamp(14px,4.1vmin,23px);
    line-height:1.62;letter-spacing:.025em;text-shadow:0 1px 0 rgba(255,248,228,.55);pointer-events:none;}
  .ending-line{display:block;min-height:1.62em;white-space:nowrap;}
  .ending-line.is-gap{min-height:.72em;}
  .ending-line .char{opacity:0;filter:blur(2px);transition:opacity .28s ease,filter .28s ease;}
  .ending-line .char.shown{opacity:1;filter:blur(0);}
  .story-continue{opacity:0;transition:opacity .5s ease;}
  .story-continue.show{opacity:1;}

  /* P34 结束页的图内按钮热区 */
  #s-ending-summary .summary-hotspot{left:6%;top:67.5%;width:88%;height:15%;touch-action:manipulation;}

  /* 考古报告中的个性信息 */
  #s-report{background-color:#e9dbc2;}
  .report-value{position:absolute;top:46.6%;z-index:24;height:3.2%;display:flex;align-items:center;
    color:#21170f;font-weight:700;font-size:clamp(11px,3.05vmin,17px);line-height:1;white-space:nowrap;
    overflow:hidden;background:rgba(244,232,209,.9);backdrop-filter:blur(2px);border-radius:3px;
    padding:0 .45em;text-shadow:0 1px 0 rgba(255,255,255,.4);}
  .report-value.name{left:13.4%;width:23.5%;cursor:pointer;}
  .report-value.date{left:70.7%;width:21.5%;}

  .name-dialog{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
    padding:9%;background:rgba(40,27,17,.6);backdrop-filter:blur(4px);}
  .name-dialog.show{display:flex;}
  .name-panel{width:100%;max-width:340px;padding:7.5% 7%;border-radius:16px;
    background:linear-gradient(180deg,#f5ead4,#e6d3ad);border:2px solid #9f7544;
    box-shadow:0 18px 45px rgba(24,15,8,.46),inset 0 0 26px rgba(120,81,35,.12);color:#332216;}
  .name-panel h2{font-size:clamp(20px,5.6vmin,30px);text-align:center;letter-spacing:.12em;margin-bottom:4%;}
  .name-panel p{font-size:clamp(12px,3.4vmin,17px);line-height:1.55;text-align:center;color:#6b4e34;margin-bottom:7%;}
  .name-panel input{display:block;width:100%;border:1px solid rgba(107,74,43,.55);border-radius:8px;
    background:rgba(255,251,239,.9);padding:3.4% 4%;font:inherit;font-size:clamp(16px,4.2vmin,22px);
    color:#2d1d12;text-align:center;outline:none;}
  .name-panel input:focus{border-color:#8B6F47;box-shadow:0 0 0 3px rgba(139,111,71,.18);}
  .name-submit{display:block;width:86%;margin:7% auto 0;padding:3.2% 5%;border-radius:30px;
    border:1.5px solid #d8b878;background:var(--cta-grad);color:#f3e7c9;font:inherit;font-weight:700;
    font-size:clamp(15px,4.1vmin,21px);letter-spacing:.14em;cursor:pointer;
    box-shadow:0 5px 14px rgba(58,38,20,.3);}
  .name-submit:active{transform:scale(.97);}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <!-- 顶部进度条 -->
    <div id="progress">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>

    <!-- 声音开关（常驻） -->
    <div id="soundBtn" title="声音开关">🔊</div>

    <!-- 背景音乐（古风 BGM，循环，点击后才加载避免阻塞首屏） -->
    <audio id="bgm" src="assets/bgm.mp3" loop preload="none"></audio>

    <!-- P1 封面 -->
    <section class="page" id="s-cover" style="background-image:url('assets/p01.jpg?v=3')">
      <div class="hotspot hint" data-go="role1" style="left:25%;top:88%;width:50%;height:6.5%"></div>
    </section>

    <!-- P2 田野考古员身份 -->
    <section class="page" id="s-role1" data-bg="assets/p02.jpg?v=3">
      <div class="hotspot hint" data-go="intro" style="left:22%;top:92%;width:56%;height:5.5%"></div>
    </section>

    <!-- P3 剧情引导（视频，播完自动进入山洞页） -->
    <section class="page" id="s-intro">
      <video id="introVideo" src="assets/p03.mp4?v=3" playsinline preload="metadata"></video>
      <div class="skip" id="btn-skip">跳过 ▸</div>
    </section>

    <!-- P3.5 山洞 · 进入探方 -->
    <section class="page" id="s-cave" data-bg="assets/p03b.jpg?v=3">
      <div class="hotspot hint" data-go="map" style="left:22%;top:80.5%;width:56%;height:11%"></div>
    </section>

    <!-- P4 / P14 遗址总览（状态切换背景，JS renderMap 设置） -->
    <section class="page" id="s-map">
      <!-- 点位热区由 JS 按 POINTS 动态注入 -->
    </section>

    <!-- 第三遗址：穿孔蚌器拼图（碎片由 JS 注入） -->
    <section class="page" id="s-puzzle">
      <div class="puzzle-board" id="puzzleBoard">
        <div class="puzzle-progress" id="puzzleProgress">拼合 0 / 9</div>
      </div>
    </section>

    <!-- P5 / P6 文物挖掘（刮土） -->
    <section class="page" id="s-dig">
      <canvas class="scratch" id="digCanvas"></canvas>
      <div class="hintword" id="digHint">滑动手铲，轻柔刮开土层</div>
      <div class="toast" id="digToast">发现远古考古遗存！可提取修复</div>
      <button class="cta" id="btn-dig" style="top:90%">送 往 工 作 台</button>
    </section>

    <!-- P7 文物修复师身份 -->
    <section class="page" id="s-role2" data-bg="assets/p07.jpg?v=3">
      <div class="hotspot hint" data-go="clean" style="left:22%;top:92%;width:56%;height:5.5%"></div>
    </section>

    <!-- P8 / P9 文物清理（刮浮土） -->
    <section class="page" id="s-clean">
      <canvas class="scratch" id="cleanCanvas"></canvas>
      <div class="hintword" id="cleanHint">滑动软毛刷，清理标本表面浮土</div>
      <div class="toast" id="cleanToast">遗存细节已完整显露</div>
      <button class="cta" id="btn-clean" style="top:90%">生 成 考 古 档 案</button>
    </section>

    <!-- P10 考古档案知识卡（背景由 onEnter 按文物数据设置） -->
    <section class="page" id="s-archive">
      <button class="cta" id="btn-archive" style="top:91%">开 始 答 题</button>
    </section>

    <!-- P11 科普答题（背景由 onEnter 按文物数据设置） -->
    <section class="page" id="s-quiz">
      <div class="hotspot" data-ans="A" style="left:27%;top:66.5%;width:46%;height:6.2%"></div>
      <div class="hotspot" data-ans="B" style="left:27%;top:75.5%;width:46%;height:6.2%"></div>
      <div class="hotspot" data-ans="C" style="left:27%;top:84.5%;width:46%;height:6.2%"></div>
    </section>

    <!-- P12 回答正确（背景由 onEnter 按文物数据设置） -->
    <section class="page" id="s-correct">
      <button class="cta" id="btn-correct" style="top:92%">下 一 步</button>
    </section>

    <!-- P13 回答错误（背景由 onEnter 按文物数据设置） -->
    <section class="page" id="s-wrong">
      <button class="cta" id="btn-wrong" style="top:92%">返 回 重 答</button>
    </section>

    <!-- 第四遗址探索完成页 -->
    <section class="page" id="s-finish">
      <button class="cta compact" id="btn-finish" style="top:92%">下一步</button>
    </section>

    <!-- P32 结尾空景 -->
    <section class="page" id="s-ending-intro" data-bg="assets/ending-p32-empty.jpg?v=11">
      <div class="ending-hit" id="endingIntroHit"></div>
      <div class="ending-prompt">轻触屏幕，继续</div>
    </section>

    <!-- P33 结尾文字逐字浮现 -->
    <section class="page" id="s-ending-story" data-bg="assets/ending-p32-empty.jpg?v=11">
      <div class="ending-hit" id="endingStoryHit"></div>
      <div class="ending-copy" id="endingCopy"></div>
      <div class="ending-prompt story-continue" id="storyContinue">轻触屏幕，继续</div>
    </section>

    <!-- P34 完成六组探索 -->
    <section class="page" id="s-ending-summary" data-bg="assets/ending-p34-summary.jpg?v=11">
      <div class="hotspot summary-hotspot" data-go="report"></div>
    </section>

    <!-- P35 专属考古报告 -->
    <section class="page" id="s-report" data-bg="assets/ending-p35-report.jpg?v=11">
      <div class="report-value name" id="reportName" title="点击修改姓名"></div>
      <div class="report-value date" id="reportDate"></div>
    </section>

    <!-- 探索者姓名输入 -->
    <div class="name-dialog" id="nameDialog" role="dialog" aria-modal="true" aria-labelledby="nameDialogTitle">
      <form class="name-panel" id="nameForm">
        <h2 id="nameDialogTitle">留下探索者姓名</h2>
        <p>这份考古报告将记录你的六组标本溯源成果。</p>
        <input id="explorerName" name="explorerName" maxlength="8" autocomplete="off"
          placeholder="请输入姓名（最多8字）" aria-label="探索者姓名" />
        <button class="name-submit" type="submit">生成专属报告</button>
      </form>
    </div>

    <!-- 翻页过渡 -->
    <div id="flip"></div>
  </div>
</div>

<script>
/* =========================================================================
   青塘遗址 H5 —— 地基层（状态机 + 数据结构 + 导航 + 刮除引擎）
   加文物 = 往 RELICS 加一条 + 补素材 + 给 POINTS 对应点位填 relic 索引
   ========================================================================= */

/* ---------- 声音引擎（Web Audio 合成，零文件，离线可用） ---------- */
let soundOn = true;
const SFX = (()=>{
  let ctx=null, master=null, enabled=true;
  function init(){
    if(ctx) return;
    try{
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value=0.5; master.connect(ctx.destination);
    }catch(e){ ctx=null; }
  }
  function resume(){ if(ctx && ctx.state==='suspended') ctx.resume(); }
  function tone(freq,dur,type='sine',vol=0.3,slideTo=null){
    if(!enabled||!ctx) return;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,ctx.currentTime);
    if(slideTo) o.frequency.linearRampToValueAtTime(slideTo,ctx.currentTime+dur);
    g.gain.setValueAtTime(vol,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0008,ctx.currentTime+dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ctx.currentTime+dur);
  }
  function noise(dur=0.12,vol=0.14,freq=1800,q=0.8){
    if(!enabled||!ctx) return;
    const len=Math.floor(ctx.sampleRate*dur);
    const buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const n=ctx.createBufferSource(); n.buffer=buf;
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
    const g=ctx.createGain(); g.gain.setValueAtTime(vol,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0008,ctx.currentTime+dur);
    n.connect(f); f.connect(g); g.connect(master); n.start(); n.stop(ctx.currentTime+dur);
  }
  return {
    init, resume,
    setEnabled(v){ enabled=v; if(master) master.gain.value=v?0.5:0; },
    click(){ tone(640,0.06,'triangle',0.22); },
    scratch(){ noise(0.1,0.13,1000+Math.random()*700,0.7); },     // 手铲刮土
    brush(){ noise(0.13,0.08,3200+Math.random()*1500,0.6); },      // 软毛刷
    reveal(){ tone(440,0.35,'sine',0.25,760); },                   // 显露
    correct(){ tone(660,0.12,'sine',0.3); setTimeout(()=>tone(880,0.16,'sine',0.3),110); setTimeout(()=>tone(1320,0.28,'sine',0.24),250); }, // 答对
    wrong(){ tone(320,0.25,'sawtooth',0.22,170); },                // 答错

/* ---------- 导航（含宣纸翻页过渡） ---------- */
let navigating=false;
function go(page, {flip=true}={}){
  if(navigating) return; navigating=true;
  const doSwitch=()=>{
    Object.values(PAGES).forEach(id=>$(id).classList.remove('active'));
    $(PAGES[page]).classList.add('active');
    state.page=page;
    onEnter(page);
    updateProgress();
    navigating=false;
  };
  if(flip){
    const f=$('flip'); f.classList.add('on');
    setTimeout(()=>{ doSwitch(); setTimeout(()=>f.classList.remove('on'),250); },260);
  } else doSwitch();
}

function updateProgress(){
  const bar=$('progress');
  // 封面/身份/剧情页不显示进度条，进入地图后常驻
  const show=['map','puzzle','dig','role2','clean','archive','quiz','correct','wrong','finish'].includes(state.page);
  bar.classList.toggle('show',show);
  [...bar.children].forEach((c,i)=>c.classList.toggle('lit', i<state.unlockedCount));
}

/* ---------- 各页进入时的初始化 ---------- */
function onEnter(page){
  // 按需加载当前页背景（data-bg）：只解码当前页，大幅降内存
  const _el=$(PAGES[page]);
  if(_el.dataset.bg && !_el.style.backgroundImage) _el.style.backgroundImage=`url('${_el.dataset.bg}')`;
  if(page==='intro'){
    const v=$('introVideo'); v.currentTime=0; v.muted=!soundOn;
    v.onended=()=>{ if(state.page==='intro') go('cave'); };   // 播完自动进山洞页
    v.play().catch(()=>{ v.muted=true; v.play().catch(()=>{}); });  // 带声失败则静音兜底
  }
  if(page!=='intro'){ const v=$('introVideo'); if(!v.paused) v.pause(); }
  const bgm=$('bgm'); if(bgm) bgm.volume = (page==='intro') ? 0.06 : 0.32;  // 视频页压低BGM
  if(page==='map')    renderMap();
  if(page==='dig')    startScratch('dig');
  if(page==='clean')  startScratch('clean');
  // 档案/答题/正确/错误页：背景按当前文物数据切换（多文物可扩展）
  const r=RELICS[state.currentRelic];
  if(page==='puzzle') startPuzzle();
  if(page==='archive'){
    const btn=$('btn-archive');
    $('s-archive').style.backgroundImage=`url('${r.archive}')`;
    btn.classList.toggle('compact',!!r.compactArchive);
    btn.style.top=r.archiveTop||(r.compactArchive?'93.2%':'91%');
    btn.classList.add('show');
  }
  if(page==='quiz'){
    $('s-quiz').style.backgroundImage=`url('${r.quiz}')`;
    document.querySelectorAll('[data-ans]').forEach((el,i)=>{
      const rect=r.answerRects[i];
      if(rect) el.style.cssText=`left:${rect.left}%;top:${rect.top}%;width:${rect.width}%;height:${rect.height}%`;
    });
  }
  if(page==='correct'){
    const btn=$('btn-correct');
    $('s-correct').style.backgroundImage=`url('${r.correct}')`;
    btn.classList.toggle('compact',!!r.compactCorrect);
    btn.style.top=r.correctTop||(r.compactCorrect?'92.5%':'92%');
    btn.textContent=r.correctLabel||'下 一 步';
    btn.classList.add('show');
  }
  if(page==='wrong'){
    const btn=$('btn-wrong');
    $('s-wrong').style.backgroundImage=`url('${r.wrong}')`;
    btn.classList.toggle('back-corner',!!r.cornerBack);
    btn.style.left=r.backLeft||'';
    btn.style.top=r.backTop||(r.cornerBack?'3.2%':'92%');
    btn.style.padding=r.backCompact?'0.8% 2%':'';
    btn.style.fontSize=r.backCompact?'clamp(12px,3.1vmin,18px)':'';
    btn.textContent=r.backLabel||(r.cornerBack?'返 回':'返 回 重 答');
    btn.classList.add('show');
  }
  if(page==='finish'){
    $('s-finish').style.backgroundImage=`url('${r.complete}')`;
    const btn=$('btn-finish');
    btn.style.top=r.finishTop||'92%';
    btn.textContent=r.finishLabel||'下一步';
    btn.classList.add('show');
  }
  if(page==='ending-story') startEndingStory();
  if(page==='report'){
    if(!completionDate) setCompletionDate();
    showNameDialog();
  }
  if(page!=='ending-story') stopEndingStory();
}

/* ---------- 遗址总览：按状态切背景 + 注入点位热区 ---------- */
function renderMap(){
  const map=$('s-map');
  map.style.backgroundImage = `url('${MAP_IMAGES[Math.min(state.unlockedCount, MAP_IMAGES.length-1)]}')`;
  map.querySelectorAll('.pt').forEach(e=>e.remove());
  POINTS.forEach((p,idx)=>{
    const el=document.createElement('div');
    el.className='hotspot pt';
    el.style.cssText=`left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%`;
    const isNext = idx===state.unlockedCount;         // 下一个待解锁
    const built  = p.relic!==null && RELICS[p.relic]; // 已有素材
    if(isNext && built){
      el.classList.add('hint');
      el.onclick=()=>{ SFX.click(); state.currentRelic=p.relic; go(RELICS[p.relic].entry||'dig'); };
    }else{
      el.onclick=()=>toast(idx<state.unlockedCount?'该遗址已点亮':'后续遗址敬请期待，请先完成当前区域', 's-map');
    }
    map.appendChild(el);
  });
  if(state.unlockedCount>=POINTS.length){
    const next=document.createElement('div');
    next.className='hotspot pt map-ending-next';
    next.style.cssText='left:18%;top:90%;width:64%;height:7%';
    next.onclick=()=>{ SFX.click(); go('ending-intro'); };
    map.appendChild(next);
  }
}

/* ---------- 穿孔蚌器拼图：拖拽、错误回弹、正确吸附 ---------- */
function startPuzzle(){
  const relic=RELICS[state.currentRelic];
  const cfg=relic.puzzle;
  const board=$('puzzleBoard');
  const progress=$('puzzleProgress');
  let backdrop=$('r6PieceBackdrop');
  if(!backdrop){
    backdrop=document.createElement('div');
    backdrop.id='r6PieceBackdrop';
    backdrop.className='r6-piece-backdrop';
    $('s-puzzle').insertBefore(backdrop,board);
  }
  backdrop.classList.toggle('show',!!cfg.scattered);
  const boardRect=cfg.boardRect||{left:50, top:50, width:111.2, height:100};
  Object.assign(board.style,{
    left:`${boardRect.left}%`, top:`${boardRect.top}%`,
    width:`${boardRect.width}%`, height:`${boardRect.height}%`,
    transform:cfg.scattered?'none':'translate(-50%,-50%)', overflow:cfg.scattered?'visible':'hidden'
  });
  board.style.backgroundImage=cfg.board?`url('${cfg.board}')`:'none';
  const puzzlePage=$('s-puzzle');
  puzzlePage.style.backgroundImage=cfg.page?`url('${cfg.page}')`:'';
  puzzlePage.style.backgroundSize=cfg.page?'cover':'';
  puzzlePage.style.backgroundPosition=cfg.page?'center':'';
  puzzlePage.style.backgroundRepeat=cfg.page?'no-repeat':'';
  progress.style.top=cfg.scattered?'13.4%':'13.2%';
  board.querySelectorAll('.puzzle-piece').forEach(el=>el.remove());
  progress.textContent=`拼合 0 / ${cfg.pieces.length}`;
  progress.classList.remove('done');

  let locked=0;
  cfg.pieces.forEach((pieceCfg,index)=>{
    const piece=document.createElement('div');
    piece.className='puzzle-piece';
    piece.dataset.index=index;
    piece.style.cssText=`left:${pieceCfg.start.left}%;top:${pieceCfg.start.top}%;width:${pieceCfg.start.width}%;height:${pieceCfg.start.height}%`;
    const img=document.createElement('img');
    img.src=pieceCfg.src;
    img.alt=`拼图碎片${index+1}`;
    img.draggable=false;
    img.loading='eager';
    img.addEventListener('error',()=>{
      if(img.dataset.retried) return;
      img.dataset.retried='1';
      const retrySrc=`${pieceCfg.src}${pieceCfg.src.includes('?')?'&':'?'}retry=1`;
      setTimeout(()=>{ img.src=retrySrc; },80);
    });
    piece.appendChild(img);
    board.appendChild(piece);

    let dragStart=null;
    piece.addEventListener('pointerdown',e=>{
      if(piece.classList.contains('locked')) return;
      e.preventDefault();
      dragStart={x:e.clientX,y:e.clientY,id:e.pointerId};
      piece.classList.add('dragging');
      piece.setPointerCapture(e.pointerId);
    });
    piece.addEventListener('pointermove',e=>{
      if(!dragStart||e.pointerId!==dragStart.id) return;
      e.preventDefault();
      const dx=e.clientX-dragStart.x;
      const dy=e.clientY-dragStart.y;
      piece.style.transform=`translate(${dx}px,${dy}px)`;
    });
    const finishDrag=e=>{
      if(!dragStart||e.pointerId!==dragStart.id) return;
      const pr=piece.getBoundingClientRect();
      const br=board.getBoundingClientRect();
      const cx=(pr.left+pr.width/2-br.left)/br.width*100;
      const cy=(pr.top+pr.height/2-br.top)/br.height*100;
      const t=pieceCfg.target;
      const padX=t.width*.12, padY=t.height*.12;
      const correct=cx>=t.left-padX&&cx<=t.left+t.width+padX&&cy>=t.top-padY&&cy<=t.top+t.height+padY;
      dragStart=null;
      if(piece.hasPointerCapture(e.pointerId)) piece.releasePointerCapture(e.pointerId);
      piece.classList.remove('dragging');
      if(correct){
        piece.style.transform='';
        piece.style.left=`${t.left}%`;
        piece.style.top=`${t.top}%`;
        piece.style.width=`${t.width}%`;
        piece.style.height=`${t.height}%`;
        piece.classList.add('locked');
        locked++;
        progress.textContent=`拼合 ${locked} / ${cfg.pieces.length}`;
        SFX.reveal();
        if(locked===cfg.pieces.length){
          progress.textContent='拼合完成';
          progress.classList.add('done');
          SFX.light();
          toast('拼合完成，正在前往知识卡片','s-puzzle');
          setTimeout(()=>{ if(state.page==='puzzle') go('archive'); },1100);
        }
      }else{
        piece.style.transform='';
        SFX.wrong();
        toast('位置不对，再试一次','s-puzzle');
      }
    };
    piece.addEventListener('pointerup',finishDrag);
    piece.addEventListener('pointercancel',finishDrag);
  });
}

let endingComplete=false;

function buildEndingCopy(){
  const copy=$('endingCopy');
  if(copy.childElementCount) return;
  ENDING_LINES.forEach(text=>{
    const line=document.createElement('div');
    line.className=`ending-line${text?'':' is-gap'}`;
    [...text].forEach(char=>{
      const span=document.createElement('span');
      span.className='char';
      span.textContent=char;
      line.appendChild(span);
      endingChars.push(span);
    });
    copy.appendChild(line);
  });
}

function stopEndingStory(){
  if(endingTimer){ clearInterval(endingTimer); endingTimer=null; }
}

function revealEndingText(){
  endingChars.forEach(char=>char.classList.add('shown'));
  endingComplete=true;
  stopEndingStory();
  $('storyContinue').classList.add('show');
}

function startEndingStory(){
  buildEndingCopy();
  stopEndingStory();
  endingComplete=false;
  endingChars.forEach(char=>char.classList.remove('shown'));
  $('storyContinue').classList.remove('show');
  let index=0;
  endingTimer=setInterval(()=>{
    if(index>=endingChars.length){ revealEndingText(); return; }
    endingChars[index++].classList.add('shown');
  },55);
}

/* ---------- P35 报告姓名与完成日期 ---------- */
let completionDate='';
let reportDialogTimer=null;

function todayText(){
  const d=new Date();
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function setCompletionDate(){
  completionDate=todayText();
  $('reportDate').textContent=completionDate;
}

function showNameDialog(){
  const dialog=$('nameDialog');
  const input=$('explorerName');
  const current=$('reportName').textContent.trim();
  input.value=current&&current!=='青塘探源者'?current:'';
  dialog.classList.add('show');
  clearTimeout(reportDialogTimer);
  reportDialogTimer=setTimeout(()=>{
    if(state.page==='report') input.focus({preventScroll:true});
  },120);
}

/* ---------- 通用提示 ---------- */
function toast(text, pageDomId){
  const page=$(pageDomId||PAGES[state.page]);
  let t=page.querySelector('.toast.tmp');
  if(!t){ t=document.createElement('div'); t.className='toast tmp'; page.appendChild(t);}
  t.textContent=text; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),1800);
}

/* =========================================================================
   刮除引擎（覆盖网格追踪进度，不读像素 → file:// 直接可用）
   ========================================================================= */
const GX=26, GY=46;
function startScratch(kind){
  const relic=RELICS[state.currentRelic];
  const cfg=relic[kind];
  const page=$(kind==='dig'?'s-dig':'s-clean');
  const canvas=$(kind==='dig'?'digCanvas':'cleanCanvas');
  const hint=$(kind==='dig'?'digHint':'cleanHint');
  const toastEl=$(kind==='dig'?'digToast':'cleanToast');
  const cta=$(kind==='dig'?'btn-dig':'btn-clean');

  // 底层：显露后的图 / 盖层画布：带土的图
  page.style.backgroundImage=`url('${cfg.base}')`;
  canvas.style.opacity='1'; canvas.style.pointerEvents='auto';
  cta.classList.remove('show'); toastEl.classList.remove('show'); hint.style.display='';

  const ctx=canvas.getContext('2d');
  const rect=page.getBoundingClientRect();
  const W=canvas.width=Math.round(rect.width);
  const H=canvas.height=Math.round(rect.height);
  const brush=Math.max(W,H)*0.07;

  // 画盖层图（object-fit:cover）
  const img=new Image();
  let done=false;
  const covered=new Set();
  // 目标区域内的网格单元总数
  const tgt=cfg.target;
  let targetCells=0;
  for(let gx=0;gx<GX;gx++)for(let gy=0;gy<GY;gy++){
    const cx=(gx+.5)/GX, cy=(gy+.5)/GY;
    if(cx>=tgt.x0&&cx<=tgt.x1&&cy>=tgt.y0&&cy<=tgt.y1) targetCells++;
  }
  img.onload=()=>{
    const s=Math.max(W/img.width,H/img.height);
    const dw=img.width*s, dh=img.height*s;
    ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
    ctx.globalCompositeOperation='destination-out';
  };
  img.src=cfg.cover;

  let drawing=false, lastSnd=0, crect=canvas.getBoundingClientRect();
  function pos(e){
    const r=crect;
    const p=(e.touches?e.touches[0]:e);
    return {x:(p.clientX-r.left)*(W/r.width), y:(p.clientY-r.top)*(H/r.height)};
  }
  function erase(x,y){
    ctx.beginPath(); ctx.arc(x,y,brush,0,Math.PI*2); ctx.fill();
    const now=performance.now();
    if(now-lastSnd>105){ lastSnd=now; (kind==='dig'?SFX.scratch():SFX.brush()); }  // 刮土/毛刷声
    // 记录覆盖网格（仅目标区域内计入进度）
    const gx0=Math.floor((x-brush)/W*GX), gx1=Math.floor((x+brush)/W*GX);
    const gy0=Math.floor((y-brush)/H*GY), gy1=Math.floor((y+brush)/H*GY);
    for(let gx=gx0;gx<=gx1;gx++)for(let gy=gy0;gy<=gy1;gy++){
      if(gx<0||gy<0||gx>=GX||gy>=GY)continue;
      const cx=(gx+.5)/GX, cy=(gy+.5)/GY;
      if(cx>=tgt.x0&&cx<=tgt.x1&&cy>=tgt.y0&&cy<=tgt.y1) covered.add(gx+'_'+gy);
    }
    if(hint.style.display!=='none'&&covered.size>2){hint.style.display='none';}
    check();
  }
  function check(){
    if(done) return;
    if(covered.size/targetCells>=cfg.threshold){
      done=true;
      SFX.reveal();                                  // 显露音效
      // 自动清空剩余，完整显露底图
      canvas.style.pointerEvents='none';
      canvas.style.opacity='0';
      toastEl.classList.add('show');
      const nextPage=relic.autoNext&&relic.autoNext[kind];
      if(nextPage){
        setTimeout(()=>{
          if(state.page===kind && state.currentRelic===relic.id) go(nextPage);
        },900);
      }else{
        setTimeout(()=>cta.classList.add('show'),500);
      }
    }
  }
  const down=e=>{drawing=true;crect=canvas.getBoundingClientRect();const p=pos(e);erase(p.x,p.y);e.preventDefault();};
  const move=e=>{if(!drawing)return;const p=pos(e);erase(p.x,p.y);e.preventDefault();};
  const up=()=>{drawing=false;};
  canvas.onpointerdown=down; canvas.onpointermove=move;
  canvas.onpointerup=up;    canvas.onpointerleave=up;
}

/* =========================================================================
   事件绑定
   ========================================================================= */
// 首次交互解锁音频上下文（浏览器策略要求）
function unlockAudio(){
  SFX.init(); SFX.resume();
  const bgm=$('bgm'); bgm.volume=0.32; if(soundOn) bgm.play().catch(()=>{});  // 启动背景音乐
  window.removeEventListener('pointerdown',unlockAudio);
}
window.addEventListener('pointerdown',unlockAudio);

// 声音开关（控制音效 + 视频声音）
const soundBtn=$('soundBtn');
function renderSound(){ soundBtn.textContent = soundOn?'🔊':'🔇'; }
soundBtn.addEventListener('click',e=>{
  e.stopPropagation();
  soundOn=!soundOn; SFX.setEnabled(soundOn);
  const v=$('introVideo'); v.muted=!soundOn;
  const bgm=$('bgm'); if(soundOn){ bgm.play().catch(()=>{}); } else { bgm.pause(); }
  renderSound();
});
renderSound();

// data-go 热区（封面/身份页等）
document.querySelectorAll('[data-go]').forEach(el=>{
  el.addEventListener('click',()=>{
    SFX.click();
    if(el.dataset.go==='report') setCompletionDate();
    go(el.dataset.go);
  });
});
// 结尾空景 → 逐字叙事
$('endingIntroHit').addEventListener('click',()=>{ SFX.click(); go('ending-story'); });
// 第一次点击立即显示全文，第二次点击进入结束页
$('endingStoryHit').addEventListener('click',()=>{
  if(!endingComplete){
    revealEndingText();
    SFX.reveal();
  }else{
    SFX.click();
    go('ending-summary');
  }
});
// 报告姓名输入
$('nameForm').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('explorerName').value.trim().replace(/\s+/g,' ').slice(0,8);
  $('reportName').textContent=name||'青塘探源者';
  $('nameDialog').classList.remove('show');
  SFX.reveal();
});
$('reportName').addEventListener('click',showNameDialog);
// 视频页「跳过」→ 山洞页；山洞页「进入探方」热区由 data-go="map" 处理
$('btn-skip').addEventListener('click',()=>{ SFX.click(); go('cave'); });
// 挖掘完成 → 切换修复师身份
$('btn-dig').addEventListener('click',()=>{ SFX.click(); go('role2'); });
// 清理完成 → 考古档案
$('btn-clean').addEventListener('click',()=>{ SFX.click(); go('archive'); });
// 档案 → 答题
$('btn-archive').addEventListener('click',()=>{ SFX.click(); go('quiz'); });
// 答题判定（答对清脆音 / 答错低沉音）
document.querySelectorAll('[data-ans]').forEach(el=>{
  el.addEventListener('click',()=>{
    const relic=RELICS[state.currentRelic];
    const ok = el.dataset.ans===relic.answer;
    ok?SFX.correct():SFX.wrong();
    go(ok?(relic.correctPage||'correct'):'wrong');
  });
});
// 回答正确 → 点亮遗址 → 遗址总览（P14 态）
$('btn-correct').addEventListener('click',()=>{
  const relic=RELICS[state.currentRelic];
  if(relic.afterCorrect){ SFX.click(); go(relic.afterCorrect); return; }
  if(state.unlockedCount<=state.currentRelic) state.unlockedCount=state.currentRelic+1;
  SFX.light();
  go('map');
});
// 回答错误 → 返回答题
$('btn-wrong').addEventListener('click',()=>{ SFX.click(); go('quiz'); });
// 第四遗址探索完成 → 点亮第四点位
$('btn-finish').addEventListener('click',()=>{
  if(state.unlockedCount<=state.currentRelic) state.unlockedCount=state.currentRelic+1;
  SFX.light();
  go('map');
});

/* ---------- 启动 ---------- */
go('cover',{flip:false});
